name: Engineering checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
concurrency:
  group: engineering-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build placeholders only; never connect CI to the production database.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:16421
      NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-ci-public-key
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:16401
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm install --global npm@10.9.8
      - run: npm ci
      - run: npm run security:secrets
      - run: npm test
      - run: npm run test:remediation
      - name: F06 offline guard and regression suite
        run: npm exec --no -- vitest run --config tests/remediation/f06/vitest.config.mts
      - name: F06 image-check semantic guards (no Docker execution)
        run: node --test tests/remediation/f06/linux-image-check.test.mjs
      - name: Shared read and F06 performance contract regressions
        run: npm exec --no -- vitest run --config tests/performance/unit.config.mts
      - run: npm run typecheck:e2e
      - run: npm run test:e2e -- --list
      - run: npm run build
      - run: npm run typecheck
      - name: Full dependency audit and verified local remediation
        run: node --test tests/remediation/f06/dependency-gate.test.cjs
      - name: Verify installed dependencies and retain full raw audit
        run: npm run security:dependencies
      - name: Retain raw dependency audit and remediation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-security-evidence
          path: .security-evidence/
          if-no-files-found: error
          include-hidden-files: true
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm install --global npm@10.9.8
      - run: npm ci
      # Existing application diagnostics remain blocking, not suppressed.
      - run: npm run lint
  production-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
      - name: Pull exact pinned Linux base for provenance verification
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 node:22.23.2-bookworm-slim@sha256:48e4b67d85f87bd551df43704e24d252f56cc5f8e9718841aace50f19948f0f9
      - name: Build pinned production image with synthetic public configuration
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag algt-f02-ci --progress plain \
            --label org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }} \
            --label algt.f06.ci-owner="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:16421 \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=synthetic-ci-public-key \
            --build-arg NEXT_PUBLIC_SITE_URL=http://127.0.0.1:16401 . \
            2>&1 | tee "$RUNNER_TEMP/f06-production-build.log"
      - name: Verify same immutable image native paths, provenance, trust and non-root boot
        env:
          F06_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ALGT_F06_CI_IMAGE_CHECK: '1'
        run: node tooling/testing/f06-linux-image-check.mjs
      - name: Retain exact candidate image evidence, including failure and cleanup references
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: f06-linux-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .f06-linux-image-evidence/
            ${{ runner.temp }}/f06-production-build.log
          include-hidden-files: true
          if-no-files-found: error
