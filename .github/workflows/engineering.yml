name: Engineering checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
concurrency:
  group: engineering-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build placeholders only; never connect CI to the production database.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:16421
      NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-ci-public-key
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:16401
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm install --global npm@10.9.8
      - run: npm ci
      - run: npm run security:secrets
      - run: npm test
      - run: npm run test:remediation
      - run: npm run typecheck:e2e
      - run: npm run test:e2e -- --list
      - run: npm run build
      - run: npm run typecheck
      - run: npm audit --audit-level=high
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm install --global npm@10.9.8
      - run: npm ci
      # Existing application diagnostics remain blocking, not suppressed.
      - run: npm run lint
