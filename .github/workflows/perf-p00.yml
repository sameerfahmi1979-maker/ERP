name: P00 inventory safety
on:
  pull_request:
  push:
    branches: ['codex/perf-p00-*']
permissions:
  contents: read
jobs:
  inventory:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm install --global npm@10.9.8
      - run: npm ci
      - run: node node_modules/vitest/vitest.mjs run --config tests/performance/p00.config.mts --reporter=json --outputFile=p00-results.json
      - name: Require all cases to execute, including native file symlinks
        run: node -e "const r=require('./p00-results.json'); if(!r.success || r.numFailedTests || r.numPendingTests || r.numTotalTests < 81) process.exit(1); console.log({passed:r.numPassedTests,skipped:r.numPendingTests});"
